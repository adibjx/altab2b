name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Diagnose FTP layout
        run: |
          sudo apt-get update -y >/dev/null 2>&1 || true
          sudo apt-get install -y lftp >/dev/null 2>&1 || true
          lftp -u "${{ secrets.FTP_USERNAME }}","${{ secrets.FTP_PASSWORD }}" "${{ secrets.FTP_SERVER }}" <<'EOF'
          set ssl:verify-certificate no
          set ftp:ssl-allow no
          echo "===== PWD (onde a conta cai) ====="
          pwd
          echo "===== LS raiz ====="
          cls -l
          echo "===== ARVORE (find) ====="
          find
          bye
          EOF

      - name: Deploy to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Conteúdo compilado (inclui .htaccess)
          local-dir: ./dist/
          # A conta FTP já cai dentro da public_html (docroot), então
          # publicamos direto na raiz onde ela conecta.
          server-dir: ./
